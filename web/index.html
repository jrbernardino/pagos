<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pagos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pagos">
<meta name="theme-color" content="#06100d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
    --font-num: 'Space Grotesk', -apple-system, system-ui, sans-serif;
    --tabbar-h: 64px;
  }
  /* ───── Tema: Bosque dorado ───── */
  :root {
    color-scheme: dark;
    --bg: #06100d; --fg: 255,255,255;
    --text: #f4fbf7; --text-2: rgba(244,251,247,.74); --muted: rgba(244,251,247,.48);
    --acc-rgb: 255,214,0; --acc: #ffd600; --acc-hi: #ffe34d; --acc2-rgb: 255,160,0; --acc2: #ffa000; --acc-ink: #1a1404;
    --ok-rgb: 74,222,128; --ok: #4ade80; --bad-rgb: 251,113,133; --bad: #fb7185; --warn-rgb: 255,160,0; --warn: #ffa000;
    --casa-rgb: 45,212,191; --casa: #2dd4bf; --personal-rgb: 96,165,250; --personal: #60a5fa; --gasto-rgb: 251,146,60; --gasto: #fb923c;
    --glass: linear-gradient(135deg, rgba(255,255,255,.07) 0%, rgba(14,30,25,.5) 50%, rgba(6,16,13,.66) 100%);
    --glass-strong: linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(16,36,30,.64) 50%, rgba(7,18,15,.82) 100%);
    --glass-subtle: rgba(255,255,255,.045); --border: rgba(255,255,255,.12); --border-bright: rgba(255,255,255,.24);
    --shadow: 0 10px 28px -6px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.14);
    --bg-layer: radial-gradient(70% 45% at 88% 0%, rgba(16,185,129,.42), transparent 70%),
                radial-gradient(60% 42% at 0% 50%, rgba(20,184,166,.20), transparent 70%),
                radial-gradient(75% 42% at 100% 100%, rgba(255,190,0,.20), transparent 70%),
                radial-gradient(50% 30% at 10% 100%, rgba(16,185,129,.16), transparent 70%), #06100d;
    --bg-overlay: none;
    --top-bg: linear-gradient(180deg, rgba(6,16,13,.88) 0%, rgba(6,16,13,.55) 70%, rgba(6,16,13,0) 100%);
    --tab-bg: linear-gradient(135deg, rgba(28,48,41,.66), rgba(8,18,15,.82));
    --sheet-bg: linear-gradient(160deg, rgba(24,44,37,.93), rgba(7,16,13,.97));
    --toast-bg: linear-gradient(135deg, rgba(30,52,44,.94), rgba(10,22,18,.97));
    --input-bg: rgba(0,0,0,.28); --seg-bg: rgba(0,0,0,.25); --seg-on: rgba(255,255,255,.12);
    --float-shadow: 0 16px 40px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); min-height: 100%; }
  html, body { margin: 0; color: var(--text); }
  body { background: transparent; min-height: 100vh; min-height: 100lvh; }
  body { font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  /* Fondo */
  .bg { position: fixed; inset: 0; z-index: -2; background: var(--bg-layer); }
  .bg::after { content: ''; position: absolute; inset: 0; background: var(--bg-overlay); }

  /* Barra superior */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
         padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--top-bg);
         -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .top h1 { font: 700 26px/1.1 var(--font-num); margin: 0; letter-spacing: -.02em; }
  .top .st { color: var(--muted); font-size: 12px; margin-top: 2px; background: none; border: 0; padding: 0; text-align: left; display: block; }
  .icon-btn { width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--border); background: var(--glass-subtle);
              display: grid; place-items: center; color: var(--text-2); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .icon-btn svg { width: 19px; height: 19px; }
  .loadbar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .3s; }
  .loadbar.on { opacity: 1; }
  .loadbar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
    background: linear-gradient(90deg, transparent, var(--acc), var(--acc2), transparent); animation: barra 1.1s ease-in-out infinite; }
  @keyframes barra { to { left: 100%; } }
  .ptr { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 74px); z-index: 19; text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 600;
         opacity: 0; transform: translateY(-10px); transition: opacity .15s, transform .15s; pointer-events: none; }
  .ptr.on { opacity: 1; transform: none; }
  .ptr.ready { color: var(--acc-hi); }

  main { padding: 4px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px); max-width: 560px; margin: 0 auto; }
  .view { display: none; animation: fade .25s ease; }
  .view.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Vidrio */
  .glass { position: relative; background: var(--glass); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
           -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); padding: 16px; margin-bottom: 14px; }
  .glass.hero { background: var(--glass-strong); }
  .glass.hero::before { content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--fg),.35) 25%, rgba(var(--acc-rgb),.6) 50%, rgba(var(--fg),.35) 75%, transparent); }
  .ctitle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ctitle h3 { font: 700 15px var(--font-num); margin: 0; letter-spacing: .01em; }
  .ctitle .act { background: none; border: 0; color: var(--acc-hi); font-weight: 600; font-size: 13px; padding: 4px 0; }
  .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }

  /* Hero */
  .saldo { display: block; background: none; border: 0; padding: 0; margin: 4px 0 0; text-align: left; font: 700 44px/1.05 var(--font-num); letter-spacing: -.03em; }
  .saldo .cents { font-size: 22px; color: var(--text-2); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .wk { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .wk b { font: 700 15px var(--font-num); }
  .wk span { color: var(--muted); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { border-radius: 14px; padding: 10px 10px 11px; background: var(--glass-subtle); border: 1px solid var(--border); min-width: 0; }
  .kpi .k { color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .kpi .v { font: 700 17px var(--font-num); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v.in { color: var(--ok); }
  .kpi.end { background: linear-gradient(135deg, rgba(var(--acc-rgb),.16), rgba(var(--acc2-rgb),.07)); border-color: rgba(var(--acc-rgb),.4); box-shadow: 0 0 18px rgba(var(--acc-rgb),.10); }
  .kpi.end .v { color: var(--acc-hi); }
  .kpi.end.warn { background: linear-gradient(135deg, rgba(var(--warn-rgb),.2), rgba(var(--warn-rgb),.06)); border-color: rgba(var(--warn-rgb),.5); }
  .kpi.end.warn .v { color: var(--warn); }
  .kpi.end.bad { background: linear-gradient(135deg, rgba(var(--bad-rgb),.2), rgba(var(--bad-rgb),.06)); border-color: rgba(var(--bad-rgb),.5); }
  .kpi.end.bad .v { color: var(--bad); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { border: 1px solid var(--border); background: var(--glass-subtle); border-radius: 20px; padding: 5px 10px; font-size: 12px; color: var(--text-2); }
  .pill b { font-family: var(--font-num); color: var(--text); font-weight: 600; }

  .libre { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 13px 14px; border-radius: 16px; border: 1px solid rgba(var(--acc-rgb),.42);
           background: linear-gradient(135deg, rgba(var(--acc-rgb),.16), rgba(var(--acc2-rgb),.06)); box-shadow: 0 0 22px rgba(var(--acc-rgb),.10); }
  .libre .k { color: var(--acc-hi); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .libre .v { font: 700 30px/1.1 var(--font-num); color: var(--acc-hi); margin-top: 4px; letter-spacing: -.02em; }
  .libre .s { color: var(--text-2); font-size: 12.5px; margin-top: 4px; }
  .libre.bad { border-color: rgba(var(--bad-rgb),.5); background: linear-gradient(135deg, rgba(var(--bad-rgb),.18), rgba(var(--bad-rgb),.05)); }
  .libre.bad .k, .libre.bad .v { color: var(--bad); }
  .libre .de { font: 600 14px var(--font); color: var(--muted); letter-spacing: 0; }
  .libre .bar { height: 6px; border-radius: 4px; background: rgba(var(--fg),.1); margin: 10px 0 8px; overflow: hidden; }
  .libre .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--acc2), var(--acc)); }
  .libre.bad .bar i { background: var(--bad); }
  .libre .meta { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(var(--fg),.1); font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .libre .meta.ok { color: var(--ok); }
  .libre .meta.no { color: var(--warn); }
  .explica p { color: var(--text-2); font-size: 14px; margin: 0 0 10px; }
  .explica b { color: var(--text); }

  /* Filas */
  .row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-top: 1px solid rgba(var(--fg),.07); padding: 11px 0; text-align: left; }
  .list > .row:first-child { border-top: 0; padding-top: 2px; }
  .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; font: 700 13px var(--font-num); border: 1px solid; }
  .ic.casa { color: var(--casa); background: rgba(var(--casa-rgb),.13); border-color: rgba(var(--casa-rgb),.32); }
  .ic.personal { color: var(--personal); background: rgba(var(--personal-rgb),.13); border-color: rgba(var(--personal-rgb),.32); }
  .ic.ingreso { color: var(--ok); background: rgba(var(--ok-rgb),.13); border-color: rgba(var(--ok-rgb),.32); }
  .ic.gasto { color: var(--gasto); background: rgba(var(--gasto-rgb),.13); border-color: rgba(var(--gasto-rgb),.32); }
  .row .mid { flex: 1; min-width: 0; }
  .row .c { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .f { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .row .m { text-align: right; font: 600 15.5px var(--font-num); white-space: nowrap; }
  .row .m.in { color: var(--ok); }
  .row .w { display: block; font: 500 11.5px var(--font); color: var(--muted); margin-top: 2px; }
  .row .w.soon { color: var(--acc-hi); }
  .row .w.late { color: var(--bad); }
  .glass.alert { border-color: rgba(var(--bad-rgb),.45); }
  .glass.confirm { border-color: rgba(var(--ok-rgb),.45); }
  .empty { color: var(--muted); text-align: center; padding: 26px 8px; }

  /* Mini gráfica en inicio */
  .mini { display: flex; align-items: center; gap: 14px; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
  .mini svg { flex: 1; height: 54px; min-width: 0; }
  .mini .lo .k { color: var(--muted); font-size: 11.5px; }
  .mini .lo .v { font: 700 18px var(--font-num); }
  .mini .lo .d { color: var(--muted); font-size: 12px; }

  /* Semanas */
  .weeks { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin: 0 -16px 12px; padding: 2px 16px 4px; scrollbar-width: none; }
  .weeks::-webkit-scrollbar { display: none; }
  .wchip { scroll-snap-align: start; flex: none; border: 1px solid var(--border); background: var(--glass); border-radius: 14px; padding: 8px 12px; text-align: left; min-width: 96px;
           -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .wchip .a { font-size: 11.5px; color: var(--muted); }
  .wchip .b { font: 700 15px var(--font-num); margin-top: 2px; }
  .wchip.on { border-color: rgba(var(--acc-rgb),.55); background: linear-gradient(135deg, rgba(var(--acc-rgb),.18), rgba(var(--acc2-rgb),.06)); box-shadow: 0 0 16px rgba(var(--acc-rgb),.14); }
  .wchip.on .a { color: var(--acc-hi); }
  .whead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .whead .big { font: 700 34px/1 var(--font-num); letter-spacing: -.02em; margin-top: 6px; }
  .whead .nav { display: flex; gap: 6px; }
  .wsub { color: var(--muted); font-size: 12.5px; margin: 8px 0 12px; }
  .tag { display: inline-block; font: 700 10px var(--font); letter-spacing: .08em; color: var(--acc-ink); background: var(--acc); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }

  /* Gráfica grande */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--seg-bg); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 13px; padding: 8px 2px; border-radius: 9px; white-space: nowrap; }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 1px 1px rgba(255,255,255,.12); }
  .chart-wrap { position: relative; margin: 12px -4px 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .chart-wrap svg { display: block; width: 100%; }
  .readout { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; }
  .readout .d { color: var(--muted); font-size: 12.5px; }
  .readout .v { font: 700 30px/1.1 var(--font-num); letter-spacing: -.02em; }
  .readout .delta { font: 600 13px var(--font-num); text-align: right; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* Movimientos */
  .bars .b { margin-top: 10px; }
  .bars .t { display: flex; justify-content: space-between; font-size: 13px; }
  .bars .t span:last-child { font-family: var(--font-num); font-weight: 600; }
  .bars .track { height: 6px; border-radius: 4px; background: rgba(var(--fg),.07); margin-top: 5px; overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--acc2), var(--acc)); }

  /* Barra de pestañas */
  .tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 30; max-width: 536px; margin: 0 auto;
            height: var(--tabbar-h); display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center;
            background: var(--tab-bg); border: 1px solid var(--border-bright); border-radius: 24px;
            box-shadow: var(--float-shadow), inset 0 1px 1px rgba(255,255,255,.2); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); }
  .tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 600; padding: 6px 0; }
  .tab svg { width: 22px; height: 22px; transition: transform .2s; }
  .tab.on { color: var(--acc-hi); }
  .tab.on svg { filter: drop-shadow(0 0 6px rgba(var(--acc-rgb),.45)); transform: translateY(-1px); }
  .plus { justify-self: center; width: 56px; height: 56px; border-radius: 19px; border: 0; margin-top: -26px; display: grid; place-items: center; color: var(--acc-ink);
          background: linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow: 0 10px 26px rgba(var(--acc2-rgb),.42), 0 0 0 4px rgba(var(--fg),.06), inset 0 1px 1px rgba(255,255,255,.55); }
  .plus svg { width: 26px; height: 26px; }
  .plus:active, .tab:active, .icon-btn:active { transform: scale(.94); }

  /* Hoja inferior */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 560px; margin: 0 auto; border-radius: 26px 26px 0 0;
           padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); border: 1px solid var(--border-bright); border-bottom: 0;
           background: var(--sheet-bg); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
           transform: translateY(110%); transition: transform .28s cubic-bezier(.16,1,.3,1); max-height: 88vh; overflow-y: auto; }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(var(--fg),.25); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 2px; font: 700 21px var(--font-num); }
  .sheet .f { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 14px; padding: 0 14px; background: var(--input-bg); margin-bottom: 12px; }
  .field:focus-within { border-color: rgba(var(--acc-rgb),.6); box-shadow: 0 0 0 3px rgba(var(--acc-rgb),.14); }
  .field span { color: var(--muted); font: 600 22px var(--font-num); }
  .field input { flex: 1; border: 0; background: none; color: var(--text); font: 700 26px/1 var(--font-num); padding: 13px 0; outline: none; min-width: 0; }
  .field input.txt { font: 500 16px var(--font); }
  .btn { display: block; width: 100%; border: 0; border-radius: 15px; padding: 15px; font: 700 16px var(--font); margin-top: 8px; }
  .btn.primary { color: var(--acc-ink); background: linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow: 0 8px 22px rgba(var(--acc2-rgb),.3); }
  .btn.ghost { background: rgba(var(--fg),.06); border: 1px solid var(--border); color: var(--text); }
  .btn.plain { background: none; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .chip { border: 1px solid var(--border); background: rgba(var(--fg),.05); border-radius: 18px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; }
  .chip.on { background: rgba(var(--acc-rgb),.18); border-color: rgba(var(--acc-rgb),.6); color: var(--acc-hi); }
  .sheet .seg { margin-bottom: 14px; }

  .toast { position: fixed; left: 16px; right: 16px; z-index: 60; max-width: 528px; margin: 0 auto;
           bottom: calc(env(safe-area-inset-bottom) + var(--tabbar-h) + 22px); color: #fff;
           display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
           background: var(--toast-bg); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 12px 30px rgba(0,0,0,.4);
           -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); font-size: 14px;
           opacity: 0; transform: translateY(12px); pointer-events: none; visibility: hidden; transition: opacity .2s, transform .2s, visibility 0s .2s; }
  .toast.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .2s, transform .2s; }
  .toast button { border: 0; background: rgba(var(--acc-rgb),.22); color: var(--acc); font-weight: 700; border-radius: 9px; padding: 6px 10px; flex: none; }

  .setup p { color: var(--text-2); font-size: 14px; }
</style>
</head>
<body>
<div class="bg"></div>

<header class="top">
  <div><h1 id="title">Inicio</h1><button class="st" id="status"></button></div>
  <div class="loadbar" id="loadbar"></div>
</header>

<div class="ptr" id="ptr">Desliza para actualizar</div>
<main id="app">
  <section class="view on" id="v-inicio"><div class="empty">Cargando…</div></section>
  <section class="view" id="v-semanas"></section>
  <section class="view" id="v-grafica"></section>
  <section class="view" id="v-movs"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab on" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>Inicio</button>
  <button class="tab" data-tab="semanas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Pagos</button>
  <button class="plus" id="fab" aria-label="Agregar gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="grafica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="m4 15 5-5 4 3 7-7"/></svg>Proyección</button>
  <button class="tab" data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Movimientos</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Deshacer</button></div>

<script>
// ─── Configuración ───────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbwP3mtPN-LEpJLIkaJgOxllG1ISbNsKS_zTzZQ0DgGgZolN4cw3C7mvtHKCeWc0c4X6/exec';

// ─── Utilidades ──────────────────────────────────────────────
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => mxn.format(n).replace('.00', '');
const short = (n) => Math.abs(n) >= 1000 ? (n < 0 ? '−' : '') + '$' + (Math.abs(n) / 1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1).replace('.0', '') + 'k' : money(n);
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const toDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = (s) => { const d = toDate(s); return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };
const fmtCorto = (s) => { const d = toDate(s); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };
const diff = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inicial = (s) => esc(String(s).trim().charAt(0).toUpperCase() || '•');

const cfg = {
  get url() { return API_URL || store.get('hub.url') || ''; },
  get token() { return store.get('hub.token') || ''; }
};

const TITULOS = { inicio: 'Inicio', semanas: 'Pagos', grafica: 'Proyección', movs: 'Movimientos' };
let vista = null;
let ocupado = false;
let tab = store.get('hub.tab') || 'inicio';
let semanaSel = null;
let subPagos = store.get('hub.sub') || 'semanas';
let rango = +(store.get('hub.rango') || 30);
let actualizado = null;

// ─── API ─────────────────────────────────────────────────────
async function api(body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = body
      ? await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ ...body, token: cfg.token }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal })
      : await fetch(`${cfg.url}?action=data&token=${encodeURIComponent(cfg.token)}`, { signal: ctrl.signal });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Error del servidor');
    return j.data;
  } finally { clearTimeout(t); }
}

function girar(on) { $('#loadbar').classList.toggle('on', on); }

function estado() {
  $('#status').textContent = actualizado ? 'Actualizado ' + actualizado.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
}

async function cargar() {
  if (!cfg.url || !cfg.token) return pantallaSetup();
  if (ocupado) return;
  ocupado = true;
  girar(true);
  try {
    vista = await api();
    actualizado = new Date();
    store.set('hub.cache', JSON.stringify({ vista, at: Date.now() }));
    render();
    estado();
  } catch (e) {
    if (String(e.message).includes('Token')) { store.del('hub.token'); return pantallaSetup('El token no coincide. Revisa Hub_Config.'); }
    const c = JSON.parse(store.get('hub.cache') || 'null');
    if (c && !vista) { vista = c.vista; render(); }
    $('#status').textContent = 'Sin conexión' + (c ? ' · ' + new Date(c.at).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '');
  } finally {
    ocupado = false;
    girar(false);
  }
}

async function accion(body, msg, undoId) {
  cerrarHoja();
  girar(true);
  try {
    vista = await api(body);
    actualizado = new Date();
    store.set('hub.cache', JSON.stringify({ vista, at: Date.now() }));
    render();
    estado();
    if (msg) toast(msg, undoId);
  } catch (e) {
    toast('No se pudo: ' + e.message);
  } finally {
    girar(false);
  }
}

// ─── Navegación ──────────────────────────────────────────────
function irA(t, nuevo = true) {
  tab = TITULOS[t] ? t : 'inicio';
  store.set('hub.tab', tab);
  $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + tab));
  $$('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = TITULOS[tab];
  if (!nuevo) return;
  window.scrollTo({ top: 0 });
  if (tab === 'grafica' && vista) renderGrafica();
}
$$('.tab').forEach((b) => b.onclick = () => irA(b.dataset.tab));


// ─── Datos derivados ─────────────────────────────────────────
function todosPendientes() {
  return [...vista.vencidos, ...vista.porConfirmar, ...vista.semanas.flatMap((w) => w.items)];
}
function eventosPorDia() {
  const m = {};
  vista.vencidos.forEach((o) => (m[vista.hoy] = m[vista.hoy] || []).push(o));
  vista.semanas.forEach((w) => w.items.forEach((o) => (m[o.fecha] = m[o.fecha] || []).push(o)));
  return m;
}
function nivelDe(n) { return n < 0 ? 'bad' : n < (vista.colchon || 0) ? 'warn' : ''; }

// ─── Render ──────────────────────────────────────────────────
function render() {
  renderInicio();
  renderSemanas();
  renderMovs();
  if (tab === 'grafica') renderGrafica();
  irA(tab, false);
}

function fila(o) {
  const d = diff(vista.hoy, o.fecha);
  const ing = o.tipo === 'ingreso';
  const cuando = d < 0 ? `Hace ${-d} día${d === -1 ? '' : 's'}` : d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : `En ${d} días`;
  const cls = d < 0 ? 'late' : d <= 2 ? 'soon' : '';
  return `<button class="row" data-id="${esc(o.id)}">
    <span class="ic ${esc(o.tipo)}">${inicial(o.concepto)}</span>
    <span class="mid"><span class="c">${esc(o.concepto)}</span><span class="f">${fmt(o.fecha)}</span></span>
    <span class="m num ${ing ? 'in' : ''}">${ing ? '+' : ''}${money(o.monto)}<span class="w ${cls}">${cuando}</span></span>
  </button>`;
}

function saldoHtml(n) {
  const s = money(n);
  const i = s.lastIndexOf('.');
  return i > 0 ? `${s.slice(0, i)}<span class="cents">${s.slice(i)}</span>` : s;
}

function renderInicio() {
  const v = vista, p = v.proyeccion, s = v.semanaActual;
  let h = `<section class="glass hero">
    <div class="label">En tu banco</div>
    <button class="saldo num" id="saldoBtn">${saldoHtml(v.saldo)}</button>
    <div class="hint">Toca para igualarlo con tu banco</div>`;
  const l = v.libre, pr = v.presupuesto, mt = v.meta;
  if (pr) {
    const pct = pr.semanal ? Math.min(100, (pr.gastado / pr.semanal) * 100) : 100;
    const maxMeta = mt ? Math.min(mt.maxSemanal, l ? l.porSemana : Infinity) : 0;
    const lineaMeta = mt
      ? (mt.alcanza
        ? `<div class="meta ok">✓ Meta ${short(mt.monto)} al ${fmtCorto(mt.fecha)} · llegas a ${short(mt.proyectado)}</div>`
        : `<div class="meta no">Meta ${short(mt.monto)} al ${fmtCorto(mt.fecha)} · te faltarían ${short(-mt.diferencia)}. Para lograrla: máx ${money(maxMeta)}/sem</div>`)
      : `<div class="meta">Toca para ponerte una meta de ahorro</div>`;
    h += `<button class="libre ${pr.excedido ? 'bad' : ''}" id="libreBtn">
        <div class="k">${pr.excedido ? 'Te pasaste esta semana' : 'Te quedan esta semana'}</div>
        <div class="v num">${pr.excedido ? '−' + money(pr.excedido) : money(pr.queda)}<span class="de"> de ${money(pr.semanal)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="s">Llevas ${money(pr.gastado)} en gastos del día a día (vie–jue)</div>
        ${lineaMeta}
      </button>`;
  } else if (l) {
    h += l.faltante
      ? `<button class="libre bad" id="libreBtn"><div class="k">Vas corto</div><div class="v num">−${money(l.faltante)}</div>
           <div class="s">El ${fmt(l.faltanteFecha)} quedarías abajo de tu colchón. Mejor no gastar extra por ahora.</div></button>`
      : `<button class="libre" id="libreBtn"><div class="k">Puedes gastar · hasta el jueves</div><div class="v num">${money(l.semana)}</div>
           <div class="s">Ritmo de ${money(l.porSemana)} por semana sin bajar de tu colchón</div></button>`;
  }
  if (s) {
    const pills = [];
    if (s.gastosExtra) pills.push(`<button class="pill" data-go="movs">Gastos extra <b>${money(s.gastosExtra)}</b></button>`);
    if (s.pagado) pills.push(`<span class="pill">Ya pagaste <b>${money(s.pagado)}</b></span>`);
    if (s.recibido || s.ingresosExtra) pills.push(`<span class="pill">Ya entró <b>${money(s.recibido + s.ingresosExtra)}</b></span>`);
    h += `<div class="wk"><b>Esta semana</b><span>${fmtCorto(s.inicio)} – ${fmtCorto(s.fin)}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Por pagar</div><div class="v">${money(s.porPagar)}</div></div>
      <div class="kpi"><div class="k">Por entrar</div><div class="v in">+${money(s.porEntrar)}</div></div>
      <div class="kpi end ${nivelDe(s.alCierre)}"><div class="k">Al jueves</div><div class="v">${money(s.alCierre)}</div></div>
    </div>
    ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}`;
  }
  h += `</section>`;

  if (v.vencidos.length) h += `<section class="glass alert"><div class="ctitle"><h3>Vencidos</h3></div><div class="list">${v.vencidos.map(fila).join('')}</div></section>`;
  if (v.porConfirmar.length) h += `<section class="glass confirm"><div class="ctitle"><h3>¿Ya llegó?</h3></div><div class="list">${v.porConfirmar.map(fila).join('')}</div></section>`;

  const proximos = v.semanas.flatMap((w) => w.items).slice(0, 5);
  h += `<section class="glass"><div class="ctitle"><h3>Próximos</h3><button class="act" data-go="semanas">Ver todos</button></div>
    <div class="list">${proximos.length ? proximos.map(fila).join('') : '<div class="empty">Nada pendiente</div>'}</div></section>`;

  h += `<section class="glass"><button class="mini" data-go="grafica">
      <div class="lo"><div class="k">Punto más bajo</div><div class="v num" style="color:${p.minimo < 0 ? 'var(--bad)' : p.minimo < v.colchon ? 'var(--warn)' : 'var(--acc-hi)'}">${money(p.minimo)}</div><div class="d">${fmt(p.minimoFecha)}</div></div>
      ${sparkline(p.puntos.slice(0, 31))}
    </button></section>`;

  $('#v-inicio').innerHTML = h;
  $('#saldoBtn').onclick = hojaSaldo;
  if ($('#libreBtn')) $('#libreBtn').onclick = hojaLibre;
  enlazar($('#v-inicio'));
}

function sparkline(pts) {
  if (!pts || pts.length < 2) return '';
  const W = 200, H = 54, ys = pts.map((p) => p.saldo), lo = Math.min(...ys), hi = Math.max(...ys);
  const x = (i) => (i * W) / (pts.length - 1), y = (v) => H - 4 - ((v - lo) * (H - 8)) / (hi - lo || 1);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.saldo).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
    <path d="${d}L${W},${H}L0,${H}Z" fill="url(#sg)"/><path d="${d}" fill="none" style="stroke:var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function renderSemanas() {
  $('#v-semanas').innerHTML = `<div class="seg" id="subseg" style="margin-bottom:12px">
      <button data-sub="semanas" class="${subPagos === 'semanas' ? 'on' : ''}">Por semana</button>
      <button data-sub="recs" class="${subPagos === 'recs' ? 'on' : ''}">Recordatorios</button></div><div id="pbody"></div>`;
  $$('[data-sub]').forEach((b) => b.onclick = () => { subPagos = b.dataset.sub; store.set('hub.sub', subPagos); renderSemanas(); });
  if (subPagos === 'recs') renderRecordatorios(); else renderPorSemana();
}

function renderPorSemana() {
  const v = vista;
  if (!v.semanas.length) { $('#pbody').innerHTML = '<div class="empty">No hay pagos pendientes.</div>'; return; }
  if (!v.semanas.some((w) => w.inicio === semanaSel)) semanaSel = v.semanas[0].inicio;
  const idx = v.semanas.findIndex((w) => w.inicio === semanaSel);
  const w = v.semanas[idx];
  const actual = v.hoy >= w.inicio && v.hoy <= w.fin;
  const casa = w.items.filter((o) => o.tipo === 'casa').reduce((a, o) => a + o.monto, 0);
  const pers = w.items.filter((o) => o.tipo === 'personal').reduce((a, o) => a + o.monto, 0);
  $('#pbody').innerHTML = `
    <div class="weeks" id="weeks">${v.semanas.map((x) => `<button class="wchip ${x.inicio === semanaSel ? 'on' : ''}" data-w="${x.inicio}">
      <div class="a">${v.hoy >= x.inicio && v.hoy <= x.fin ? 'Esta semana' : 'vie ' + fmtCorto(x.inicio)}</div><div class="b num">${short(x.apartar)}</div></button>`).join('')}</div>
    <section class="glass hero" id="wcard">
      <div class="whead">
        <div><div class="label">Apartar${actual ? '<span class="tag">AHORA</span>' : ''}</div><div class="big num">${money(w.apartar)}</div></div>
        <div class="nav">
          <button class="icon-btn" id="wprev" ${idx === 0 ? 'disabled style="opacity:.35"' : ''} aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="icon-btn" id="wnext" ${idx === v.semanas.length - 1 ? 'disabled style="opacity:.35"' : ''} aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="wsub">${fmt(w.inicio)} – ${fmt(w.fin)}</div>
      <div class="stats3" style="margin-bottom:12px">
        <div class="kpi"><div class="k">Casa</div><div class="v">${short(casa)}</div></div>
        <div class="kpi"><div class="k">Personal</div><div class="v">${short(pers)}</div></div>
        <div class="kpi"><div class="k">Entra</div><div class="v in">+${short(w.ingresos)}</div></div>
      </div>
      <div class="list">${w.items.map(fila).join('')}</div>
    </section>`;
  const mover = (d) => { const n = v.semanas[idx + d]; if (n) { semanaSel = n.inicio; renderPorSemana(); } };
  $('#wprev').onclick = () => mover(-1);
  $('#wnext').onclick = () => mover(1);
  $$('[data-w]').forEach((b) => b.onclick = () => { semanaSel = b.dataset.w; renderPorSemana(); });
  const on = $('#weeks .wchip.on');
  if (on) { const c = $('#weeks'); c.scrollLeft = on.offsetLeft - (c.clientWidth - on.clientWidth) / 2; }
  let x0 = null;
  const card = $('#wcard');
  card.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) mover(dx < 0 ? 1 : -1); });
  enlazar($('#pbody'));
}

// ─── Recordatorios (catálogo Hub_Pagos) ──────────────────────
const NOMBRE_DIA = { LU: 'lunes', MA: 'martes', MI: 'miércoles', JU: 'jueves', VI: 'viernes', SA: 'sábado', DO: 'domingo' };
function describir(p) {
  const f = p.frecuencia, d = String(p.dias || '');
  let t = f === 'mensual' ? `Cada mes el ${d.replace(',', ' y ')}`
    : f === 'bimestral' ? `Cada 2 meses el ${d}`
    : f === 'semanal' ? `Cada ${NOMBRE_DIA[d] || d}`
    : f === 'semanal_mes' ? `Mensual, repartido cada ${NOMBRE_DIA[d] || d}`
    : f === 'unica' ? `Una vez · ${p.inicio ? fmt(p.inicio) : ''}` : f;
  if (p.fin && f !== 'unica') t += ` · hasta ${fmtCorto(p.fin)} ${p.fin.slice(2, 4)}`;
  return t;
}

function renderRecordatorios() {
  const lista = (vista.pagos || []).slice();
  if (!vista.pagos) { $('#pbody').innerHTML = '<div class="empty">Actualizando… vuelve a abrir en un momento.</div>'; return; }
  lista.sort((a, b) => (b.activo - a.activo) || ((a.siguiente || '9999') < (b.siguiente || '9999') ? -1 : 1));
  const grupo = (titulo, arr) => arr.length ? `<section class="glass"><div class="ctitle"><h3>${titulo}</h3><span class="label">${arr.length}</span></div><div class="list">${arr.map((p) => `
    <button class="row" data-pago="${esc(p.id)}" style="${p.activo ? '' : 'opacity:.45'}">
      <span class="ic ${esc(p.tipo)}">${inicial(p.concepto)}</span>
      <span class="mid"><span class="c">${esc(p.concepto)}</span><span class="f">${esc(describir(p))}</span></span>
      <span class="m num ${p.tipo === 'ingreso' ? 'in' : ''}">${p.tipo === 'ingreso' ? '+' : ''}${money(p.monto)}<span class="w ${p.siguiente && diff(vista.hoy, p.siguiente) <= 2 ? 'soon' : ''}">${!p.activo ? 'Pausado' : p.siguiente ? fmtCorto(p.siguiente) : 'Sin fecha próxima'}</span></span>
    </button>`).join('')}</div></section>` : '';
  const act = lista.filter((p) => p.activo);
  $('#pbody').innerHTML = `
    <button class="btn ghost" id="nuevoPago" style="margin:0 0 12px">+ Nuevo recordatorio</button>
    ${grupo('Casa', act.filter((p) => p.tipo === 'casa'))}
    ${grupo('Personal', act.filter((p) => p.tipo === 'personal'))}
    ${grupo('Ingresos', act.filter((p) => p.tipo === 'ingreso'))}
    ${grupo('Pausados', lista.filter((p) => !p.activo))}`;
  $('#nuevoPago').onclick = () => hojaPago(null);
  $$('[data-pago]').forEach((b) => b.onclick = () => hojaPago(b.dataset.pago));
}

function hojaPago(id) {
  const p = id ? (vista.pagos || []).find((x) => x.id === id) : { concepto: '', monto: '', tipo: 'personal', frecuencia: 'mensual', dias: '', inicio: hoyLocal(), fin: '', activo: true };
  if (!p) return;
  let tipo = p.tipo, frec = p.frecuencia;
  const diaSem = /^(LU|MA|MI|JU|VI|SA|DO)$/.test(p.dias) ? p.dias : 'VI';
  abrirHoja(`
    <h3>${id ? 'Editar recordatorio' : 'Nuevo recordatorio'}</h3>
    <div class="f">${id ? 'Los cambios se aplican desde ya a la proyección.' : 'Se suma a tus pagos y a la proyección.'}</div>
    <label class="field"><input id="pc" class="txt" placeholder="Concepto (ej. Renta)" maxlength="60" value="${esc(p.concepto)}"></label>
    <label class="field"><span>$</span><input id="pm" inputmode="decimal" placeholder="0" value="${p.monto}"></label>
    <div class="seg" id="ptipo" style="margin-bottom:12px">${['casa', 'personal', 'ingreso'].map((t) => `<button data-t="${t}" class="${t === tipo ? 'on' : ''}">${{ casa: 'Casa', personal: 'Personal', ingreso: 'Ingreso' }[t]}</button>`).join('')}</div>
    <div class="chips" id="pfrec">${[['mensual', 'Mensual'], ['bimestral', 'Cada 2 meses'], ['semanal', 'Semanal'], ['unica', 'Una vez'], ['semanal_mes', 'Mensual repartido']].map(([k, n]) => `<button class="chip ${k === frec ? 'on' : ''}" data-f="${k}">${n}</button>`).join('')}</div>
    <div id="pdias"></div>
    <div id="pfechas"></div>
    ${id ? `<label class="row" style="border:0;padding:4px 0 8px"><span class="mid"><span class="c">Activo</span><span class="f">Si lo pausas deja de contar en la proyección</span></span><input type="checkbox" id="pa" ${p.activo ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--acc)"></label>` : ''}
    <button class="btn primary" id="ok">Guardar</button>
    ${id ? '<button class="btn ghost" id="del" style="color:var(--bad)">Eliminar</button>' : ''}
    <button class="btn plain" id="cancel">Cancelar</button>`);
  const pintar = () => {
    const mes = frec === 'mensual' || frec === 'bimestral', sem = frec === 'semanal' || frec === 'semanal_mes';
    $('#pdias').innerHTML = mes ? `<div class="label" style="margin:0 0 6px 4px">Día del mes</div><label class="field"><input id="pd" class="txt" inputmode="numeric" placeholder="Día del mes (ej. 12 o 15,30)" value="${esc(/^[\d,]+$/.test(p.dias) ? p.dias : '')}"></label>`
      : sem ? `<div class="label" style="margin:0 0 6px 4px">Día de la semana</div><div class="chips">${Object.keys(NOMBRE_DIA).map((k) => `<button class="chip ${k === diaSem ? 'on' : ''}" data-d="${k}">${NOMBRE_DIA[k].slice(0, 3)}</button>`).join('')}</div>` : '';
    $('#pfechas').innerHTML = frec === 'unica'
      ? `<div class="label" style="margin:0 0 6px 4px">Fecha</div><label class="field"><input id="pi" class="txt" type="date" value="${p.inicio || hoyLocal()}"></label>`
      : `<div class="label" style="margin:0 0 6px 4px">${frec === 'bimestral' ? 'Desde (un mes en que sí toca)' : 'Desde'}</div><label class="field"><input id="pi" class="txt" type="date" value="${p.inicio || hoyLocal()}"></label>
         <div class="label" style="margin:0 0 6px 4px">Hasta (opcional)</div><label class="field"><input id="pf" class="txt" type="date" value="${p.fin || ''}"></label>`;
    $$('[data-d]').forEach((b) => b.onclick = () => { $$('[data-d]').forEach((x) => x.classList.toggle('on', x === b)); });
  };
  pintar();
  $$('[data-t]').forEach((b) => b.onclick = () => { tipo = b.dataset.t; $$('[data-t]').forEach((x) => x.classList.toggle('on', x === b)); });
  $$('[data-f]').forEach((b) => b.onclick = () => { frec = b.dataset.f; $$('[data-f]').forEach((x) => x.classList.toggle('on', x === b)); pintar(); });
  $('#ok').onclick = () => {
    const sel = $('[data-d].on');
    const dias = $('#pd') ? $('#pd').value.replace(/\s/g, '') : sel ? sel.dataset.d : '';
    const pago = {
      id: id || undefined, concepto: $('#pc').value.trim(), monto: parseFloat(String($('#pm').value).replace(/[^0-9.]/g, '')),
      tipo, frecuencia: frec, dias, inicio: $('#pi').value, fin: $('#pf') ? $('#pf').value : '', activo: $('#pa') ? $('#pa').checked : true, nota: p.nota || ''
    };
    if (!pago.concepto) return $('#pc').focus();
    if (!(pago.monto > 0)) return $('#pm').focus();
    accion({ action: 'guardar_pago', pago }, id ? 'Recordatorio actualizado' : 'Recordatorio agregado');
  };
  if (id) $('#del').onclick = () => {
    if ($('#del').dataset.sure) return accion({ action: 'borrar_pago', id }, 'Recordatorio eliminado');
    $('#del').dataset.sure = '1'; $('#del').textContent = 'Toca otra vez para eliminar';
  };
  $('#cancel').onclick = cerrarHoja;
}

function renderMovs() {
  const v = vista, s = v.semanaActual;
  let h = '';
  if (s) {
    const porConcepto = {};
    (s.gastos || []).forEach((g) => { porConcepto[g.concepto] = (porConcepto[g.concepto] || 0) + g.monto; });
    const lista = Object.entries(porConcepto).sort((a, b) => b[1] - a[1]);
    const max = lista.length ? lista[0][1] : 1;
    h += `<section class="glass hero"><div class="label">Gastos extra · esta semana</div>
      <div class="whead"><div class="big num">${money(s.gastosExtra || 0)}</div></div>
      ${lista.length ? `<div class="bars">${lista.map(([c, m]) => `<div class="b"><div class="t"><span>${esc(c)}</span><span>${money(m)}</span></div><div class="track"><div class="fill" style="width:${Math.max(4, (m / max) * 100)}%"></div></div></div>`).join('')}</div>`
        : '<div class="wsub">Sin gastos extra. Usa el botón + para registrar uno.</div>'}
    </section>`;
  }
  const rec = v.recientes || [];
  h += `<section class="glass"><div class="ctitle"><h3>Historial</h3></div><div class="list">${rec.length ? rec.map((r) => {
    const entra = r.accion === 'recibido' || r.accion === 'ingreso_extra';
    const signo = r.accion === 'omitido' || r.accion === 'ajuste' ? '' : entra ? '+' : '−';
    const tipo = entra ? 'ingreso' : r.accion === 'gasto' ? 'gasto' : r.accion === 'ajuste' ? 'personal' : 'casa';
    const tag = r.accion === 'ajuste' ? 'div' : 'button';
    return `<${tag} class="row" ${tag === 'button' ? `data-mov="${esc(r.id)}"` : ''}>
      <span class="ic ${tipo}">${inicial(r.concepto)}</span>
      <span class="mid"><span class="c">${esc(r.concepto)}</span><span class="f">${esc(etiquetaAccion(r.accion))}${r.vence ? ' · ' + fmt(r.vence) : ''}</span></span>
      <span class="m num ${entra ? 'in' : ''}">${r.accion === 'omitido' ? '—' : signo + money(r.monto)}</span></${tag}>`;
  }).join('') : '<div class="empty">Aún no hay movimientos</div>'}</div></section>`;
  $('#v-movs').innerHTML = h;
  enlazar($('#v-movs'));
}

function etiquetaAccion(a) {
  return { pagado: 'Pagado', recibido: 'Recibido', omitido: 'Omitido', ajuste: 'Ajuste de saldo', gasto: 'Gasto extra', ingreso_extra: 'Ingreso extra' }[a] || a;
}

function enlazar(root) {
  root.querySelectorAll('[data-id]').forEach((b) => b.onclick = () => hojaItem(b.dataset.id));
  root.querySelectorAll('[data-mov]').forEach((b) => b.onclick = () => hojaMov(b.dataset.mov));
  root.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => irA(b.dataset.go));
}

// ─── Gráfica interactiva ─────────────────────────────────────
const RANGOS = [[14, '2 sem'], [30, '1 mes'], [60, '2 meses'], [90, '3 meses'], [120, '4 meses']];
function renderGrafica() {
  const v = vista, todos = v.proyeccion.puntos;
  if (rango > todos.length - 1) rango = 30;
  const pts = todos.slice(0, rango + 1);
  const ys = pts.map((p) => p.saldo);
  const minI = ys.indexOf(Math.min(...ys));
  $('#v-grafica').innerHTML = `
    <section class="glass hero">
      <div class="seg" id="rangos">${RANGOS.map(([r, n]) => `<button data-r="${r}" class="${r === rango ? 'on' : ''}" ${r > todos.length - 1 ? 'disabled style="opacity:.3"' : ''}>${n}</button>`).join('')}</div>
      <div class="readout"><div><div class="d" id="rdD"></div><div class="v num" id="rdV"></div></div><div class="delta" id="rdX"></div></div>
      <div class="chart-wrap" id="chart"></div>
      <div class="stats3" style="margin-top:12px">
        <div class="kpi end ${nivelDe(ys[minI])}"><div class="k">Mínimo</div><div class="v">${short(ys[minI])}</div></div>
        <div class="kpi"><div class="k">Al final</div><div class="v">${short(ys[ys.length - 1])}</div></div>
        <div class="kpi"><div class="k">Colchón</div><div class="v">${short(v.colchon || 0)}</div></div>
      </div>
    </section>
    <section class="glass"><div class="ctitle"><h3 id="dayT">Ese día</h3></div><div class="list" id="dayL"></div></section>`;
  $$('[data-r]').forEach((b) => b.onclick = () => { if (b.disabled) return; rango = +b.dataset.r; store.set('hub.rango', rango); renderGrafica(); });
  dibujar(pts, minI);
}

function dibujar(pts, sel) {
  const box = $('#chart');
  const W = Math.max(280, box.clientWidth), H = 210, padL = 4, padR = 4, padT = 14, padB = 22;
  const ys = pts.map((p) => p.saldo), col = vista.colchon || 0;
  const metaEnRango = vista.meta && pts.some((p) => p.fecha === vista.meta.fecha) ? vista.meta.monto : 0;
  let lo = Math.min(0, ...ys), hi = Math.max(...ys, col, metaEnRango);
  const span = hi - lo || 1; hi += span * .08;
  const x = (i) => padL + (i * (W - padL - padR)) / (pts.length - 1);
  const y = (v) => padT + ((hi - v) * (H - padT - padB)) / (hi - lo);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.saldo).toFixed(1)}`).join('');
  const ev = eventosPorDia();
  const mt = vista.meta, mi = mt ? pts.findIndex((p) => p.fecha === mt.fecha) : -1;
  const metaMarca = mi >= 0 ? `<line x1="${x(mi)}" x2="${x(mi)}" y1="${y(mt.monto)}" y2="${H - padB}" style="stroke:var(--ok)" stroke-opacity=".5" stroke-dasharray="2 4"/>
    <circle cx="${x(mi)}" cy="${y(mt.monto)}" r="4.5" style="fill:var(--bg);stroke:var(--ok)" stroke-width="2"/>
    <text x="${Math.min(x(mi), W - 24)}" y="${y(mt.monto) - 9}" style="fill:var(--ok)" font-size="10.5" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui">meta</text>` : '';
  const dots = pts.map((p, i) => (ev[p.fecha] || []).some((o) => o.tipo !== 'ingreso') ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.saldo).toFixed(1)}" r="2.6" style="fill:var(--acc2)"/>` : '').join('');
  const meses = pts.map((p, i) => p.fecha.endsWith('-01') ? i : -1).filter((i) => i > 0 && x(i) - x(0) > 52);
  const lejos = (i) => i > 3 && i < pts.length - 4 && meses.every((m) => Math.abs(m - i) > 3);
  const ticks = pts.map((p, i) => ({ p, i })).filter(({ p, i }) => i === 0 || meses.includes(i) || (pts.length <= 31 && toDate(p.fecha).getUTCDay() === 1 && lejos(i)))
    .map(({ p, i }) => `<text x="${x(i).toFixed(1)}" y="${H - 5}" style="fill:var(--muted)" font-size="10.5" text-anchor="${i === 0 ? 'start' : 'middle'}" font-family="Plus Jakarta Sans, system-ui">${fmtCorto(p.fecha)}</text>`).join('');
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--acc2);stop-opacity:0"/></linearGradient>
      <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${lo < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--bad)" stroke-opacity=".6" stroke-dasharray="3 4"/>` : ''}
    ${col ? `<line x1="0" x2="${W}" y1="${y(col)}" y2="${y(col)}" style="stroke:var(--warn)" stroke-opacity=".5" stroke-dasharray="2 5"/><text x="${W - 4}" y="${y(col) - 5}" style="fill:var(--warn)" font-size="10" text-anchor="end" font-family="Plus Jakarta Sans, system-ui">colchón</text>` : ''}
    <path d="${line}L${x(pts.length - 1)},${H - padB}L${x(0)},${H - padB}Z" fill="url(#ga)"/>
    <path d="${line}" fill="none" style="stroke:var(--acc)" stroke-width="2.4" stroke-linejoin="round" filter="url(#glow)"/>
    ${dots}
    ${metaMarca}
    ${ticks}
    <line id="cx" y1="${padT - 6}" y2="${H - padB}" style="stroke:var(--muted)" stroke-width="1"/>
    <circle id="cc" r="6" style="fill:var(--bg);stroke:var(--acc-hi)" stroke-width="2.5"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>
  </svg>`;

  const setSel = (i) => {
    i = Math.max(0, Math.min(pts.length - 1, i));
    const p = pts[i], X = x(i), Y = y(p.saldo);
    $('#cx').setAttribute('x1', X); $('#cx').setAttribute('x2', X);
    $('#cc').setAttribute('cx', X); $('#cc').setAttribute('cy', Y);
    $('#rdD').textContent = i === 0 ? 'Hoy · ' + fmt(p.fecha) : fmt(p.fecha);
    $('#rdV').textContent = money(p.saldo);
    $('#rdV').style.color = p.saldo < 0 ? 'var(--bad)' : p.saldo < col ? 'var(--warn)' : 'var(--text)';
    const dlt = p.saldo - pts[0].saldo;
    $('#rdX').innerHTML = i === 0 ? '' : `<span style="color:${dlt >= 0 ? 'var(--ok)' : 'var(--bad)'}">${dlt >= 0 ? '+' : '−'}${money(Math.abs(dlt))}</span><div class="d" style="color:var(--muted);font-weight:500">vs hoy</div>`;
    const items = ev[p.fecha] || [];
    $('#dayT').textContent = i === 0 ? 'Hoy' : fmt(p.fecha);
    $('#dayL').innerHTML = items.length ? items.map(fila).join('') : '<div class="empty" style="padding:14px 0">Sin movimientos ese día</div>';
    enlazar($('#dayL'));
  };
  const desdeX = (cx) => { const r = box.getBoundingClientRect(); return Math.round(((cx - r.left - padL) / (W - padL - padR)) * (pts.length - 1)); };
  const hit = $('#hit');
  let activo = false;
  hit.addEventListener('pointerdown', (e) => { activo = true; setSel(desdeX(e.clientX)); });
  hit.addEventListener('pointermove', (e) => { if (activo || e.pointerType === 'mouse') setSel(desdeX(e.clientX)); });
  window.addEventListener('pointerup', () => { activo = false; });
  hit.addEventListener('touchmove', (e) => { setSel(desdeX(e.touches[0].clientX)); }, { passive: true });
  setSel(sel);
}
window.addEventListener('resize', () => { if (tab === 'grafica' && vista) renderGrafica(); });

// ─── Hojas inferiores ────────────────────────────────────────
function abrirHoja(html) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#scrim').classList.add('on');
  $('#sheet').classList.add('on');
}
function cerrarHoja() {
  $('#scrim').classList.remove('on');
  $('#sheet').classList.remove('on');
}
$('#scrim').onclick = cerrarHoja;

function hojaItem(id) {
  const o = todosPendientes().find((x) => x.id === id);
  if (!o) return;
  const ing = o.tipo === 'ingreso';
  abrirHoja(`
    <h3>${esc(o.concepto)}</h3>
    <div class="f">${fmt(o.fecha)} · ${ing ? 'Ingreso' : o.tipo === 'casa' ? 'Casa (pagas 100%)' : 'Personal'}</div>
    <label class="field"><span>$</span><input id="monto" inputmode="decimal" value="${o.monto}"></label>
    <button class="btn primary" id="ok">${ing ? 'Marcar recibido' : 'Marcar pagado'}</button>
    <button class="btn ghost" id="skip">${ing ? 'No llegó / omitir' : 'Omitir esta vez'}</button>
    <button class="btn plain" id="cancel">Cancelar</button>`);
  $('#ok').onclick = () => {
    const m = parseFloat(String($('#monto').value).replace(/[^0-9.]/g, ''));
    if (!(m >= 0)) return;
    accion({ action: ing ? 'recibir' : 'pagar', id, monto: m }, `${o.concepto} · ${ing ? 'recibido' : 'pagado'}`, id);
  };
  $('#skip').onclick = () => accion({ action: 'omitir', id }, `${o.concepto} · omitido`, id);
  $('#cancel').onclick = cerrarHoja;
}

function hojaPlan() {
  const pr = vista.presupuesto, mt = vista.meta, l = vista.libre;
  const cfgMeta = mt || {};
  abrirHoja(`<div class="explica">
    <h3>Tu plan</h3>
    <div class="f">Lo que te pongas aquí ya se descuenta en la proyección y en "Al jueves".</div>
    <div class="label" style="margin:0 0 6px 4px">Gasto del día a día por semana</div>
    <label class="field"><span>$</span><input id="ppres" inputmode="decimal" value="${pr.semanal}"></label>
    <div class="label" style="margin:0 0 6px 4px">Meta de ahorro</div>
    <label class="field"><span>$</span><input id="pmeta" inputmode="decimal" placeholder="Ej. 100000" value="${cfgMeta.monto || ''}"></label>
    <div class="label" style="margin:0 0 6px 4px">Para el</div>
    <label class="field"><input id="pfecha" class="txt" type="date" value="${cfgMeta.fecha || ''}"></label>
    ${mt ? `<p>Con ${money(pr.semanal)} por semana llegas al <b>${fmt(mt.fecha)}</b> con <b>${money(mt.proyectado)}</b>${mt.alcanza ? ' ✓' : `; te faltarían <b>${money(-mt.diferencia)}</b>`}.</p>
            <p>Para lograr la meta podrías gastar como máximo <b>${money(Math.min(mt.maxSemanal, l ? l.porSemana : Infinity))} por semana</b>.</p>` : ''}
    ${l ? `<p>Lo máximo que aguanta tu flujo sin bajar del colchón de ${money(vista.colchon)} es <b>${money(l.porSemana)} por semana</b> (el día más apretado es el ${fmt(l.cuello)}).</p>` : ''}
    ${vista.proyeccionBase ? `<p>Sin ningún gasto del día a día terminarías el horizonte con ${money(vista.proyeccionBase.final)}.</p>` : ''}
    </div>
    <button class="btn primary" id="ok">Guardar</button>
    ${mt ? '<button class="btn ghost" id="quitar">Quitar meta</button>' : ''}
    <button class="btn plain" id="cancel">Cerrar</button>`);
  const num = (sel) => String($(sel).value).replace(/[^0-9.]/g, '');
  $('#ok').onclick = () => {
    const pres = parseFloat(num('#ppres'));
    if (!(pres >= 0)) return $('#ppres').focus();
    const meta = num('#pmeta'), fecha = $('#pfecha').value;
    if ((meta && !fecha) || (!meta && fecha)) { (meta ? $('#pfecha') : $('#pmeta')).focus(); return toast('Pon monto y fecha de la meta'); }
    accion({ action: 'config', presupuesto: pres, meta_monto: meta, meta_fecha: fecha }, 'Plan actualizado');
  };
  if (mt) $('#quitar').onclick = () => accion({ action: 'config', meta_monto: '', meta_fecha: '' }, 'Meta quitada');
  $('#cancel').onclick = cerrarHoja;
}

function hojaLibre() {
  if (vista.presupuesto) return hojaPlan();
  const l = vista.libre;
  if (!l) return;
  abrirHoja(`<div class="explica">
    <h3>¿De dónde sale?</h3>
    <div class="f">Ya descuenta todos tus pagos, la despensa y tu colchón de ${money(vista.colchon)}.</div>

    <p>De hoy al jueves te tocan <b>${money(l.semana)}</b>. Lo que gastes con el botón + se descuenta solo.</p>
    <p>El día que más te aprieta es el <b>${fmt(l.cuello)}</b>; por eso el número no es más alto.</p>
    <p>Si de plano necesitas, hoy podrías gastar hasta <b>${money(l.limite)}</b> de golpe sin bajar del colchón, pero te quedarías sin margen para lo que sigue.</p>
    </div>
    <button class="btn ghost" id="verProy">Ver proyección</button>

}

function hojaSaldo() {
  abrirHoja(`
    <h3>Saldo en tu banco</h3>
    <div class="f">Lo que dice tu banco ahorita. Al marcar pagos, ingresos y gastos se actualiza solo.</div>
    <label class="field"><span>$</span><input id="saldo" inputmode="decimal" value="${vista.saldo}"></label>
    <button class="btn primary" id="ok">Guardar</button>
    <button class="btn plain" id="cancel">Cancelar</button>`);
  $('#ok').onclick = () => {
    const m = parseFloat(String($('#saldo').value).replace(/[^0-9.\-]/g, ''));

const CATEGORIAS = ['Comida', 'Gasolina', 'Súper', 'Uber', 'Salida', 'Farmacia', 'Otro'];
function hoyLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function hojaGasto() {
  let modo = 'gasto';
  abrirHoja(`
    <div class="seg"><button class="on" data-modo="gasto">Gasto</button><button data-modo="ingreso_extra">Ingreso extra</button></div>
    <label class="field"><span>$</span><input id="monto" inputmode="decimal" placeholder="0"></label>
    <div class="chips" id="chips">${CATEGORIAS.map((c) => `<button class="chip" data-cat="${c}">${c}</button>`).join('')}</div>
    <label class="field"><input id="concepto" class="txt" placeholder="¿En qué fue?" maxlength="80"></label>
    <label class="field"><input id="fecha" class="txt" type="date" value="${hoyLocal()}"></label>
    <button class="btn primary" id="ok">Guardar</button>
    <button class="btn plain" id="cancel">Cancelar</button>`);
  $$('[data-modo]').forEach((b) => b.onclick = () => {
    modo = b.dataset.modo;
    $$('[data-modo]').forEach((x) => x.classList.toggle('on', x === b));
    $('#chips').style.display = modo === 'gasto' ? '' : 'none';
  });
  $$('[data-cat]').forEach((b) => b.onclick = () => {
    $$('[data-cat]').forEach((x) => x.classList.toggle('on', x === b));
    if (b.dataset.cat !== 'Otro') $('#concepto').value = b.dataset.cat;
    else { $('#concepto').value = ''; $('#concepto').focus(); }
  });
  setTimeout(() => $('#monto').focus(), 280);
  $('#ok').onclick = () => {
    const m = parseFloat(String($('#monto').value).replace(/[^0-9.]/g, ''));
    if (!(m > 0)) { $('#monto').focus(); return; }
    const concepto = $('#concepto').value.trim();
    accion({ action: modo, monto: m, concepto, fecha: $('#fecha').value }, `${concepto || (modo === 'gasto' ? 'Gasto' : 'Ingreso')} · ${money(m)}`);
  };
  $('#cancel').onclick = cerrarHoja;
}

function hojaMov(id) {
  const r = (vista.recientes || []).find((x) => x.id === id);
  if (!r) return;
  abrirHoja(`
    <h3>${esc(r.concepto)}</h3>
    <div class="f">${esc(etiquetaAccion(r.accion))} · ${money(r.monto)}${r.vence ? ' · ' + fmt(r.vence) : ''}</div>
    <button class="btn ghost" id="undo">Deshacer este movimiento</button>
    <button class="btn plain" id="cancel">Cerrar</button>`);
  $('#undo').onclick = () => accion({ action: 'deshacer', id }, 'Deshecho');
  $('#cancel').onclick = cerrarHoja;
}

// ─── Toast ───────────────────────────────────────────────────
let toastTimer;
function toast(msg, undoId) {
  $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = undoId ? '' : 'none';
  $('#toastUndo').onclick = () => { $('#toast').classList.remove('on'); accion({ action: 'deshacer', id: undoId }, 'Deshecho'); };
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 4500);
}

// ─── Primera vez ─────────────────────────────────────────────
function pantallaSetup(aviso) {
  irA('inicio');
  $('#v-inicio').innerHTML = `<section class="glass hero setup">
    <h3 style="margin:0 0 6px;font:700 20px var(--font-num)">Conectar con tu Sheet</h3>
    <p>${aviso ? esc(aviso) : 'Pega el token que aparece en el menú <b>Hub de pagos → Ver token</b> de tu Sheet.'}</p>
    ${API_URL ? '' : `<label class="field"><input id="url" class="txt" placeholder="URL del Web App (…/exec)" value="${esc(cfg.url)}" autocapitalize="off" autocorrect="off"></label>`}
    <label class="field"><input id="tok" class="txt" placeholder="Token" value="" autocapitalize="off" autocorrect="off"></label>
    <button class="btn primary" id="go">Conectar</button>
  </section>`;
  $('#go').onclick = () => {
    if (!API_URL) store.set('hub.url', $('#url').value.trim());
    store.set('hub.token', $('#tok').value.trim());
    $('#v-inicio').innerHTML = '<div class="empty">Cargando…</div>';
    cargar();
  };
}

// ─── Arranque ────────────────────────────────────────────────
$('#status').onclick = cargar;

// Deslizar hacia abajo para actualizar
(() => {
  let y0 = null, listo = false;
  const ptr = $('#ptr'), app = $('#app');
  window.addEventListener('touchstart', (e) => {
    y0 = window.scrollY <= 0 && !$('#sheet').classList.contains('on') ? e.touches[0].clientY : null;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy < 15 || window.scrollY > 0) { ptr.classList.remove('on', 'ready'); app.style.transform = ''; listo = false; return; }
    listo = dy > 90;
    app.style.transition = 'none';
    app.style.transform = `translateY(${Math.min(dy / 2.4, 46)}px)`;
    ptr.classList.add('on');
    ptr.classList.toggle('ready', listo);
    ptr.textContent = listo ? 'Suelta para actualizar' : 'Desliza para actualizar';
  }, { passive: true });
  window.addEventListener('touchend', () => {
    if (listo) cargar();
    app.style.transition = 'transform .25s ease';
    app.style.transform = '';
    ptr.classList.remove('on', 'ready');
    y0 = null; listo = false;
  });
})();
$('#fab').onclick = () => { if (vista) hojaGasto(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cargar(); });
setInterval(() => { if (document.visibilityState === 'visible' && !$('#sheet').classList.contains('on')) cargar(); }, 60000);
irA(tab);
const cache = JSON.parse(store.get('hub.cache') || 'null');
if (cache && cfg.token) { vista = cache.vista; render(); }
cargar();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
  // Cuando entra una versión nueva de la app, recarga una vez para usarla
  let recargado = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargado) { recargado = true; location.reload(); } });
}
</script>
</body>
