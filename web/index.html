<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pagos">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --ink: #1c1d1a;
    --muted: #6f6f66;
    --line: #e4dfd3;
    --accent: #1f6f4a;
    --accent-ink: #ffffff;
    --accent-soft: #e2efe6;
    --warn: #a86400;
    --warn-soft: #f8ead2;
    --bad: #b3261e;
    --bad-soft: #f8e0dd;
    --casa: #3d5a80;
    --personal: #7a4e8c;
    --ingreso: #1f6f4a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121311;
      --card: #1c1d1a;
      --ink: #eeece6;
      --muted: #9a998f;
      --line: #2c2d29;
      --accent: #4fb985;
      --accent-ink: #0d1a12;
      --accent-soft: #1d3327;
      --warn: #e5a54b;
      --warn-soft: #3a2c16;
      --bad: #f08a80;
      --bad-soft: #3d1f1c;
      --casa: #8fb0d8;
      --personal: #c49bd6;
      --ingreso: #4fb985;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 32px);
    max-width: 560px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 12px; }
  header h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; }
  .icon-btn { background: var(--card); border: 1px solid var(--line); color: var(--ink); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
  .icon-btn.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .hero .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .hero .saldo { font-size: 40px; font-weight: 700; letter-spacing: -.03em; margin: 2px 0 2px; background: none; border: 0; color: var(--ink); padding: 0; text-align: left; }
  .hero .sub { color: var(--muted); font-size: 13px; }
  .hero .minimo { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .hero .minimo.warn { background: var(--warn-soft); }
  .hero .minimo.bad { background: var(--bad-soft); }
  .chart { margin-top: 12px; width: 100%; height: 72px; display: block; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .week-head .t { font-weight: 600; }
  .week-head .apartar { font-weight: 700; font-size: 18px; }
  .week-sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .now-tag { display: inline-block; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }

  .item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 0; color: var(--ink); text-align: left; font: inherit; }
  .item:first-of-type { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.casa { background: var(--casa); } .dot.personal { background: var(--personal); } .dot.ingreso { background: var(--ingreso); }
  .item .mid { flex: 1; min-width: 0; }
  .item .c { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .f { display: block; color: var(--muted); font-size: 13px; }
  .item .m { font-weight: 600; text-align: right; }
  .item .m.in { color: var(--ingreso); }
  .item .when { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .item .when.soon { color: var(--warn); }
  .item .when.late { color: var(--bad); }
  .card.alert { border-color: var(--bad); }
  .card.confirm { border-color: var(--accent); }

  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin: 4px 4px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .hist .item { cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; }
  .status { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }

  /* Hoja inferior */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(105%); transition: transform .25s ease; }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 2px; font-size: 20px; }
  .sheet .f { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; background: var(--bg); margin-bottom: 14px; }
  .field span { color: var(--muted); font-size: 22px; }
  .field input { flex: 1; border: 0; background: none; color: var(--ink); font: 600 24px/1 -apple-system, system-ui, sans-serif; padding: 14px 0; outline: none; min-width: 0; }
  .field input.txt { font-size: 15px; font-weight: 400; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 600 17px/1 -apple-system, system-ui, sans-serif; margin-top: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn.plain { background: none; color: var(--muted); }
  .btn:disabled { opacity: .5; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; transform: translateY(160%); transition: transform .25s ease; font-size: 15px; }
  .toast.on { transform: none; }
  .toast button { background: none; border: 0; color: var(--accent); font: 600 15px -apple-system, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { .toast button { color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 6px 10px; } }

  .setup p { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Pagos</h1>
  <button class="icon-btn" id="refresh" aria-label="Actualizar">↻</button>
</header>
<main id="app"><div class="empty">Cargando…</div></main>
<div class="status" id="status"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Deshacer</button></div>

<script>
// ─── Configuración ───────────────────────────────────────────
// Pega aquí la URL del Web App (termina en /exec). Si la dejas vacía, la app la pide al abrir.
const API_URL = 'https://script.google.com/macros/s/AKfycbwP3mtPN-LEpJLIkaJgOxllG1ISbNsKS_zTzZQ0DgGgZolN4cw3C7mvtHKCeWc0c4X6/exec';

// ─── Utilidades ──────────────────────────────────────────────
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => mxn.format(n).replace('.00', '');
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const toDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = (s) => { const d = toDate(s); return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };
const diff = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const cfg = {
  get url() { return API_URL || store.get('hub.url') || ''; },
  get token() { return store.get('hub.token') || ''; }
};

let vista = null;
let ocupado = false;

// ─── API ─────────────────────────────────────────────────────
async function api(body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = body
      ? await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ ...body, token: cfg.token }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal })
      : await fetch(`${cfg.url}?action=data&token=${encodeURIComponent(cfg.token)}`, { signal: ctrl.signal });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Error del servidor');
    return j.data;
  } finally { clearTimeout(t); }
}

async function cargar() {
  if (!cfg.url || !cfg.token) return pantallaSetup();
  if (ocupado) return;
  ocupado = true;
  $('#refresh').classList.add('spin');
  try {
    vista = await api();
    store.set('hub.cache', JSON.stringify({ vista, at: Date.now() }));
    render();
    $('#status').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    if (String(e.message).includes('Token')) { store.del('hub.token'); return pantallaSetup('El token no coincide. Revisa Hub_Config.'); }
    const c = JSON.parse(store.get('hub.cache') || 'null');
    if (c && !vista) { vista = c.vista; render(); }
    $('#status').textContent = 'Sin conexión' + (c ? ' · datos de ' + new Date(c.at).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '');
  } finally {
    ocupado = false;
    $('#refresh').classList.remove('spin');
  }
}

async function accion(body, msg, undoId) {
  cerrarHoja();
  $('#refresh').classList.add('spin');
  try {
    vista = await api(body);
    store.set('hub.cache', JSON.stringify({ vista, at: Date.now() }));
    render();
    if (msg) toast(msg, undoId);
  } catch (e) {
    toast('No se pudo: ' + e.message);
  } finally {
    $('#refresh').classList.remove('spin');
  }
}

// ─── Render ──────────────────────────────────────────────────
function render() {
  const v = vista;
  const hoy = v.hoy;
  const p = v.proyeccion;
  const nivel = p.minimo < 0 ? 'bad' : p.minimo < v.colchon ? 'warn' : '';
  let h = '';

  h += `<section class="card hero">
    <div class="label">Saldo en cuenta</div>
    <button class="saldo num" id="saldoBtn">${money(v.saldo)}</button>
    <div class="sub">Toca para ajustar con tu banco</div>
    <div class="minimo ${nivel}"><span>Punto más bajo</span><strong class="num">${money(p.minimo)} · ${fmt(p.minimoFecha)}</strong></div>
    ${grafica(p.puntos, p.minimoFecha)}
  </section>`;

  if (v.vencidos.length) {
    h += `<h2>Vencidos</h2><section class="card alert">${v.vencidos.map((o) => fila(o, hoy)).join('')}</section>`;
  }
  if (v.porConfirmar.length) {
    h += `<h2>¿Ya llegó?</h2><section class="card confirm">${v.porConfirmar.map((o) => fila(o, hoy)).join('')}</section>`;
  }

  if (!v.semanas.length) h += '<div class="empty">No hay pagos pendientes en el horizonte.</div>';
  v.semanas.forEach((w, i) => {
    const actual = hoy >= w.inicio && hoy <= w.fin;
    h += `<h2>${actual ? 'Esta semana' : i === 1 && v.semanas[0] && hoy >= v.semanas[0].inicio ? 'Siguiente semana' : 'Semana del ' + fmt(w.inicio)}</h2>
    <section class="card">
      <div class="week-head"><span class="t">Apartar${actual ? '<span class="now-tag">AHORA</span>' : ''}</span><span class="apartar num">${money(w.apartar)}</span></div>
      <div class="week-sub">${fmt(w.inicio)} – ${fmt(w.fin)}${w.ingresos ? ' · entran ' + money(w.ingresos) : ''}</div>
      ${w.items.map((o) => fila(o, hoy)).join('')}
    </section>`;
  });

  h += `<div class="legend"><span><i class="dot casa"></i>Casa</span><span><i class="dot personal"></i>Personal</span><span><i class="dot ingreso"></i>Ingreso</span></div>`;

  if (v.recientes && v.recientes.length) {
    h += `<h2>Últimos movimientos</h2><section class="card hist">${v.recientes.map((r) => `
      <div class="item"><span class="mid"><span class="c">${esc(r.concepto)}</span><span class="f">${esc(etiquetaAccion(r.accion))} · ${r.vence ? fmt(r.vence) : ''}</span></span>
      <span class="m num ${r.accion === 'recibido' ? 'in' : ''}">${r.accion === 'omitido' ? '—' : (r.accion === 'recibido' ? '+' : r.accion === 'ajuste' ? '' : '−') + money(r.monto)}</span></div>`).join('')}</section>`;
  }

  $('#app').innerHTML = h;
  $('#saldoBtn').onclick = hojaSaldo;
  document.querySelectorAll('[data-id]').forEach((b) => b.onclick = () => hojaItem(b.dataset.id));
}

function etiquetaAccion(a) {
  return { pagado: 'Pagado', recibido: 'Recibido', omitido: 'Omitido', ajuste: 'Ajuste de saldo' }[a] || a;
}

function fila(o, hoy) {
  const d = diff(hoy, o.fecha);
  const ing = o.tipo === 'ingreso';
  const cuando = d < 0 ? `Hace ${-d} día${d === -1 ? '' : 's'}` : d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : `En ${d} días`;
  const cls = d < 0 ? 'late' : d <= 2 ? 'soon' : '';
  return `<button class="item" data-id="${esc(o.id)}">
    <i class="dot ${esc(o.tipo)}"></i>
    <span class="mid"><span class="c">${esc(o.concepto)}</span><span class="f">${fmt(o.fecha)}</span></span>
    <span class="m num ${ing ? 'in' : ''}">${ing ? '+' : ''}${money(o.monto)}<span class="when ${cls}">${cuando}</span></span>
  </button>`;
}

function grafica(puntos, minFecha) {
  if (!puntos || puntos.length < 2) return '';
  const W = 320, H = 72, pad = 4;
  const ys = puntos.map((p) => p.saldo);
  const lo = Math.min(0, ...ys), hi = Math.max(...ys);
  const sx = (i) => pad + (i * (W - 2 * pad)) / (puntos.length - 1);
  const sy = (v) => H - pad - ((v - lo) * (H - 2 * pad)) / (hi - lo || 1);
  const path = puntos.map((p, i) => `${i ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(p.saldo).toFixed(1)}`).join('');
  const mi = puntos.findIndex((p) => p.fecha === minFecha);
  const zero = sy(0).toFixed(1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Saldo proyectado">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${mi >= 0 ? `<circle cx="${sx(mi).toFixed(1)}" cy="${sy(puntos[mi].saldo).toFixed(1)}" r="3.5" fill="var(--warn)"/>` : ''}
  </svg>`;
}

// ─── Hojas inferiores ────────────────────────────────────────
function abrirHoja(html) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#scrim').classList.add('on');
  $('#sheet').classList.add('on');
}
function cerrarHoja() {
  $('#scrim').classList.remove('on');
  $('#sheet').classList.remove('on');
}
$('#scrim').onclick = cerrarHoja;

function buscar(id) {
  const all = [...vista.vencidos, ...vista.porConfirmar, ...vista.semanas.flatMap((w) => w.items)];
  return all.find((o) => o.id === id);
}

function hojaItem(id) {
  const o = buscar(id);
  if (!o) return;
  const ing = o.tipo === 'ingreso';
  abrirHoja(`
    <h3>${esc(o.concepto)}</h3>
    <div class="f">${fmt(o.fecha)} · ${ing ? 'Ingreso' : o.tipo === 'casa' ? 'Casa (pagas 100%)' : 'Personal'}</div>
    <label class="field"><span>$</span><input id="monto" class="num" inputmode="decimal" value="${o.monto}"></label>
    <button class="btn primary" id="ok">${ing ? 'Marcar recibido' : 'Marcar pagado'}</button>
    <button class="btn ghost" id="skip">${ing ? 'No llegó / omitir' : 'Omitir este mes'}</button>
    <button class="btn plain" id="cancel">Cancelar</button>`);
  $('#ok').onclick = () => {
    const m = parseFloat(String($('#monto').value).replace(/[^0-9.]/g, ''));
    if (!(m >= 0)) return;
    accion({ action: ing ? 'recibir' : 'pagar', id, monto: m }, `${o.concepto} · ${ing ? 'recibido' : 'pagado'}`, id);
  };
  $('#skip').onclick = () => accion({ action: 'omitir', id }, `${o.concepto} · omitido`, id);
  $('#cancel').onclick = cerrarHoja;
}

function hojaSaldo() {
  abrirHoja(`
    <h3>Saldo en cuenta</h3>
    <div class="f">Lo que dice tu banco ahorita. Al marcar pagos e ingresos se actualiza solo.</div>
    <label class="field"><span>$</span><input id="saldo" class="num" inputmode="decimal" value="${vista.saldo}"></label>
    <button class="btn primary" id="ok">Guardar</button>
    <button class="btn plain" id="cancel">Cancelar</button>`);
  $('#ok').onclick = () => {
    const m = parseFloat(String($('#saldo').value).replace(/[^0-9.\-]/g, ''));
    if (isNaN(m)) return;
    accion({ action: 'saldo', monto: m }, 'Saldo actualizado');
  };
  $('#cancel').onclick = cerrarHoja;
}

// ─── Toast con deshacer ──────────────────────────────────────
let toastTimer;
function toast(msg, undoId) {
  $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = undoId ? '' : 'none';
  $('#toastUndo').onclick = () => { $('#toast').classList.remove('on'); accion({ action: 'deshacer', id: undoId }, 'Deshecho'); };
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 5000);
}

// ─── Primera vez ─────────────────────────────────────────────
function pantallaSetup(aviso) {
  $('#app').innerHTML = `<section class="card setup">
    <h3 style="margin:0 0 6px">Conectar con tu Sheet</h3>
    <p>${aviso ? esc(aviso) : 'Pega el token que aparece en el menú <b>Hub de pagos → Ver token</b> de tu Sheet.'}</p>
    ${API_URL ? '' : `<label class="field"><input id="url" class="txt" placeholder="URL del Web App (…/exec)" value="${esc(cfg.url)}" autocapitalize="off" autocorrect="off"></label>`}
    <label class="field"><input id="tok" class="txt" placeholder="Token" value="" autocapitalize="off" autocorrect="off"></label>
    <button class="btn primary" id="go">Conectar</button>
  </section>`;
  $('#go').onclick = () => {
    if (!API_URL) store.set('hub.url', $('#url').value.trim());
    store.set('hub.token', $('#tok').value.trim());
    $('#app').innerHTML = '<div class="empty">Cargando…</div>';
    cargar();
  };
}

// ─── Arranque ────────────────────────────────────────────────
$('#refresh').onclick = cargar;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cargar(); });
const cache = JSON.parse(store.get('hub.cache') || 'null');
if (cache && cfg.token) { vista = cache.vista; render(); }
cargar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
